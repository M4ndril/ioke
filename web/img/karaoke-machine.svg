<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#3a0f52"/>
      <stop offset="0.42" stop-color="#1a0729"/>
      <stop offset="1" stop-color="#040206"/>
    </radialGradient>
    <linearGradient id="beamPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3fa4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3fa4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36d6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#36d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="beamBlur" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a3a"/>
      <stop offset="1" stop-color="#0f0e16"/>
    </linearGradient>
    <linearGradient id="bodySheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1c55"/>
      <stop offset="0.6" stop-color="#1c0b4a"/>
      <stop offset="1" stop-color="#3a0a4a"/>
    </linearGradient>
    <linearGradient id="lyric" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3fa4"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <radialGradient id="cone" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#40404f"/>
      <stop offset="0.5" stop-color="#17171f"/>
      <stop offset="0.82" stop-color="#2a2a37"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </radialGradient>
    <radialGradient id="cap" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#7a7a8e"/>
      <stop offset="1" stop-color="#15151d"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" x2="1">
      <stop offset="0" stop-color="#4d4d5a"/>
      <stop offset="0.3" stop-color="#f1f1f7"/>
      <stop offset="0.55" stop-color="#8d8d9c"/>
      <stop offset="0.8" stop-color="#d7d7e0"/>
      <stop offset="1" stop-color="#33333e"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" x2="1">
      <stop offset="0" stop-color="#0c0c11"/>
      <stop offset="0.35" stop-color="#3a3a46"/>
      <stop offset="0.6" stop-color="#15151c"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <pattern id="mesh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#a9a9b8"/>
      <circle cx="4.5" cy="4.5" r="2.5" fill="#23232c"/>
    </pattern>
    <radialGradient id="meshShade" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12071b" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="reflFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflMask" maskUnits="userSpaceOnUse" x="0" y="1180" width="1000" height="220">
      <rect x="0" y="1180" width="1000" height="220" fill="url(#reflFade)"/>
    </mask>
  </defs>

  <!-- fundo -->
  <rect width="1000" height="1400" fill="url(#bg)"/>

  <!-- canhoes de luz -->
  <g filter="url(#beamBlur)">
    <polygon points="150,-20 230,-20 470,1200 -60,1200" fill="url(#beamPink)"/>
    <polygon points="770,-20 850,-20 1060,1200 540,1200" fill="url(#beamCyan)"/>
    <polygon points="470,-20 530,-20 700,1150 300,1150" fill="url(#beamGold)" opacity="0.8"/>
  </g>

  <!-- bokeh -->
  <g filter="url(#bokeh)">
    <circle cx="90" cy="210" r="34" fill="#ff3fa4" opacity="0.28"/>
    <circle cx="170" cy="120" r="16" fill="#ffd27a" opacity="0.35"/>
    <circle cx="880" cy="170" r="40" fill="#36d6ff" opacity="0.22"/>
    <circle cx="930" cy="420" r="18" fill="#ff3fa4" opacity="0.3"/>
    <circle cx="60" cy="520" r="22" fill="#36d6ff" opacity="0.25"/>
    <circle cx="820" cy="80" r="14" fill="#ffd27a" opacity="0.4"/>
    <circle cx="330" cy="60" r="24" fill="#b36bff" opacity="0.25"/>
    <circle cx="690" cy="240" r="12" fill="#ffd27a" opacity="0.35"/>
    <circle cx="960" cy="700" r="30" fill="#b36bff" opacity="0.22"/>
    <circle cx="40" cy="880" r="36" fill="#ff3fa4" opacity="0.18"/>
    <circle cx="880" cy="1000" r="20" fill="#36d6ff" opacity="0.25"/>
    <circle cx="140" cy="330" r="10" fill="#fff" opacity="0.3"/>
    <circle cx="760" cy="330" r="9" fill="#fff" opacity="0.28"/>
  </g>

  <!-- brilho do palco -->
  <ellipse cx="500" cy="1190" rx="430" ry="70" fill="#ff3fa4" opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="500" cy="1190" rx="260" ry="36" fill="#36d6ff" opacity="0.18" filter="url(#soft)"/>

  <!-- maquina de karaoke -->
  <g id="machine">
    <!-- coroa com lampadas -->
    <rect x="262" y="318" width="476" height="104" rx="46" fill="#17161f" stroke="#2f2d3d" stroke-width="3"/>
    <rect x="262" y="318" width="476" height="104" rx="46" fill="none" stroke="#ffd27a" stroke-width="3" opacity="0.5" filter="url(#glowSm)"/>
    <g fill="#ffd9a0" filter="url(#glow)">
      <circle cx="312" cy="370" r="9"/><circle cx="352" cy="370" r="9"/><circle cx="392" cy="370" r="9"/>
      <circle cx="432" cy="370" r="9"/><circle cx="472" cy="370" r="9"/><circle cx="528" cy="370" r="9"/>
      <circle cx="568" cy="370" r="9"/><circle cx="608" cy="370" r="9"/><circle cx="648" cy="370" r="9"/>
      <circle cx="688" cy="370" r="9"/>
    </g>
    <circle cx="500" cy="370" r="20" fill="#ff3fa4" filter="url(#glow)"/>
    <path d="M494 358 h12 v14 a6 6 0 0 1 -12 0 z M500 378 v8 M492 386 h16" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- corpo -->
    <rect x="226" y="398" width="548" height="788" rx="46" fill="none" stroke="#ff3fa4" stroke-width="6" filter="url(#glow)" opacity="0.95"/>
    <rect x="230" y="402" width="540" height="780" rx="42" fill="url(#body)"/>
    <rect x="230" y="402" width="540" height="780" rx="42" fill="url(#bodySheen)"/>

    <!-- tela com a letra -->
    <rect x="276" y="452" width="448" height="272" rx="20" fill="#06060a" stroke="#34323f" stroke-width="3"/>
    <rect x="294" y="470" width="412" height="236" rx="12" fill="url(#screen)"/>
    <g opacity="0.9">
      <rect x="350" y="512" width="300" height="16" rx="8" fill="#ffffff" opacity="0.22"/>
      <rect x="330" y="560" width="340" height="22" rx="11" fill="#ffffff" opacity="0.32"/>
      <rect x="330" y="560" width="214" height="22" rx="11" fill="url(#lyric)" filter="url(#glowSm)"/>
      <rect x="370" y="612" width="260" height="16" rx="8" fill="#ffffff" opacity="0.22"/>
      <rect x="400" y="656" width="200" height="16" rx="8" fill="#ffffff" opacity="0.16"/>
    </g>
    <circle cx="544" cy="540" r="8" fill="#ffd27a" filter="url(#glow)"/>
    <path d="M294 470 L520 470 L380 706 L294 706 Z" fill="#ffffff" opacity="0.05"/>

    <!-- painel: VU meter e botoes -->
    <rect x="276" y="748" width="448" height="64" rx="14" fill="#14131b" stroke="#2c2a37" stroke-width="2"/>
    <g>
      <rect x="298" y="770" width="9" height="22" rx="2" fill="#46d369"/>
      <rect x="312" y="766" width="9" height="26" rx="2" fill="#46d369"/>
      <rect x="326" y="762" width="9" height="30" rx="2" fill="#46d369"/>
      <rect x="340" y="758" width="9" height="34" rx="2" fill="#46d369"/>
      <rect x="354" y="756" width="9" height="36" rx="2" fill="#46d369"/>
      <rect x="368" y="760" width="9" height="32" rx="2" fill="#46d369"/>
      <rect x="382" y="757" width="9" height="35" rx="2" fill="#9be15d"/>
      <rect x="396" y="762" width="9" height="30" rx="2" fill="#f5d547"/>
      <rect x="410" y="766" width="9" height="26" rx="2" fill="#f5a524"/>
      <rect x="424" y="770" width="9" height="22" rx="2" fill="#ff5c63" opacity="0.5"/>
      <rect x="438" y="774" width="9" height="18" rx="2" fill="#ff5c63" opacity="0.3"/>
    </g>
    <g>
      <circle cx="560" cy="780" r="15" fill="url(#chrome)"/><line x1="560" y1="780" x2="566" y2="768" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <circle cx="610" cy="780" r="15" fill="url(#chrome)"/><line x1="610" y1="780" x2="600" y2="770" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <circle cx="660" cy="780" r="15" fill="url(#chrome)"/><line x1="660" y1="780" x2="672" y2="776" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <circle cx="700" cy="770" r="5" fill="#ff3fa4" filter="url(#glowSm)"/>
      <circle cx="700" cy="792" r="5" fill="#36d6ff" filter="url(#glowSm)"/>
    </g>

    <!-- alto-falantes -->
    <g>
      <circle cx="375" cy="950" r="112" fill="none" stroke="#36d6ff" stroke-width="4" opacity="0.7" filter="url(#glow)"/>
      <circle cx="375" cy="950" r="106" fill="#0b0b11" stroke="#2c2b39" stroke-width="6"/>
      <circle cx="375" cy="950" r="92" fill="url(#cone)"/>
      <circle cx="375" cy="950" r="62" fill="none" stroke="#2f2e3d" stroke-width="3"/>
      <circle cx="375" cy="950" r="34" fill="url(#cap)"/>
      <ellipse cx="362" cy="936" rx="12" ry="7" fill="#fff" opacity="0.18"/>
      <circle cx="625" cy="950" r="112" fill="none" stroke="#36d6ff" stroke-width="4" opacity="0.7" filter="url(#glow)"/>
      <circle cx="625" cy="950" r="106" fill="#0b0b11" stroke="#2c2b39" stroke-width="6"/>
      <circle cx="625" cy="950" r="92" fill="url(#cone)"/>
      <circle cx="625" cy="950" r="62" fill="none" stroke="#2f2e3d" stroke-width="3"/>
      <circle cx="625" cy="950" r="34" fill="url(#cap)"/>
      <ellipse cx="612" cy="936" rx="12" ry="7" fill="#fff" opacity="0.18"/>
    </g>

    <!-- base com entradas de microfone -->
    <rect x="276" y="1086" width="448" height="62" rx="14" fill="#14131b" stroke="#2c2a37" stroke-width="2"/>
    <circle cx="330" cy="1117" r="14" fill="#08080c" stroke="url(#chrome)" stroke-width="4"/>
    <circle cx="380" cy="1117" r="14" fill="#08080c" stroke="url(#chrome)" stroke-width="4"/>
    <rect x="450" y="1108" width="160" height="6" rx="3" fill="#ffffff" opacity="0.15"/>
    <rect x="450" y="1122" width="110" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
    <rect x="650" y="1104" width="40" height="26" rx="6" fill="#ff3fa4" opacity="0.85" filter="url(#glowSm)"/>
    <rect x="262" y="1176" width="70" height="18" rx="6" fill="#0a0a0e"/>
    <rect x="668" y="1176" width="70" height="18" rx="6" fill="#0a0a0e"/>
  </g>

  <!-- reflexo no chao -->
  <use xlink:href="#machine" href="#machine" transform="translate(0 2380) scale(1 -1)" mask="url(#reflMask)" opacity="0.55"/>
  <rect x="0" y="1180" width="1000" height="220" fill="url(#floor)"/>

  <!-- cabo do microfone -->
  <path d="M330 1117 C 300 1210, 220 1260, 200 1330 S 150 1420, 90 1440" stroke="#050507" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M330 1117 C 300 1210, 220 1260, 200 1330 S 150 1420, 90 1440" stroke="#3a3a48" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- microfone em primeiro plano -->
  <g transform="translate(205 1235) rotate(-28)">
    <ellipse cx="0" cy="-70" rx="92" ry="92" fill="#ff3fa4" opacity="0.28" filter="url(#soft)"/>
    <rect x="-27" y="10" width="54" height="250" rx="22" fill="url(#handle)"/>
    <rect x="-24" y="60" width="4" height="170" rx="2" fill="#ffffff" opacity="0.12"/>
    <rect x="-33" y="-12" width="66" height="34" rx="10" fill="url(#chrome)"/>
    <circle cx="0" cy="-72" r="72" fill="url(#mesh)"/>
    <circle cx="0" cy="-72" r="72" fill="url(#meshShade)"/>
    <circle cx="0" cy="-72" r="72" fill="none" stroke="url(#chrome)" stroke-width="7"/>
    <path d="M-60 -72 a60 60 0 0 1 120 0" stroke="url(#chrome)" stroke-width="5" fill="none" opacity="0.8"/>
    <circle cx="0" cy="-72" r="75" fill="none" stroke="#ff3fa4" stroke-width="2" opacity="0.6" filter="url(#glowSm)"/>
  </g>

  <!-- notas musicais -->
  <g font-family="Segoe UI Symbol, Segoe UI, Arial Unicode MS, sans-serif" font-weight="700" filter="url(#glow)">
    <text x="110" y="330" font-size="84" fill="#36d6ff" transform="rotate(-14 110 330)">♪</text>
    <text x="820" y="560" font-size="96" fill="#ff3fa4" transform="rotate(12 820 560)">♫</text>
    <text x="860" y="290" font-size="60" fill="#ffd27a" transform="rotate(8 860 290)">♪</text>
    <text x="80" y="760" font-size="64" fill="#ffd27a" transform="rotate(-8 80 760)">♫</text>
    <text x="850" y="880" font-size="54" fill="#36d6ff" transform="rotate(14 850 880)">♪</text>
  </g>
</svg>
